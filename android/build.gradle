allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    
    afterEvaluate { subproject ->
        if (subproject.plugins.hasPlugin('com.android.library') || subproject.plugins.hasPlugin('com.android.application')) {
            if (subproject.android.namespace == null) {
                def manifestFile = subproject.android.sourceSets.main.manifest.srcFile
                if (manifestFile.exists()) {
                    def manifestText = manifestFile.text
                    def packageName = manifestText.find(/package="([^"]*)"/)
                    if (packageName) {
                        packageName = packageName.replace('package="', '').replace('"', '')
                        subproject.android.namespace = packageName
                        println "Namespace set to: ${packageName} for project: ${subproject.name}"
                    }
                }
            }
            
            subproject.android.compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
